<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="stitle sdesc">
  <title id="stitle">可视化组件预览</title>
  <desc id="sdesc">Section header for visual component showcase.</desc>

  <rect width="1200" height="140" rx="14" fill="#181825"/>
  <line x1="60" y1="139" x2="1140" y2="139" stroke="#313244" stroke-width="1"/>

  <text x="60" y="72"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
        font-size="36" font-weight="700"
