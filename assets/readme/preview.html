<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InkLoom README Preview</title>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    img {
      width: 100%;
      display: block;
      border-radius: 12px;
    }
    .readme-md {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px 32px;
      line-height: 1.6;
    }
    .readme-md h1, .readme-md h2, .readme-md h3 {
      border-bottom: 1px solid #30363d;
      padding-bottom: 8px;
    }
    .readme-md a { color: #58a6ff; }
    .readme-md code {
      background: #21262d;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .readme-md pre {
      background: #21262d;
      padding: 12px 16px;
      border-radius: 8px;
      overflow-x: auto;
    }
    .readme-md pre code { background: none; padding: 0; }
    .readme-md table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }
    .readme-md th, .readme-md td {
      border: 1px solid #30363d;
      padding: 8px 12px;
      text-align: left;
    }
    .readme-md th { background: #21262d; }
  </style>
</head>
<body>
  <div class="container">
    <img src="hero.svg" alt="hero">
    <img src="section-features.svg" alt="features">
    <img src="section-showcase.svg" alt="showcase">
    <img src="section-quickstart.svg" alt="quickstart">
  </div>
</body>
</html>
