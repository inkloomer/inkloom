# Netlify 免费档静态托管：纯静态站，不启用 Functions / Identity / Analytics 等任何付费特性
[build]
  # 与 .github/workflows/deploy.yml 相同的安装链（Node 22 + corepack 激活 pnpm），已在该链路验证可行
  command = "corepack enable && corepack prepare pnpm@11.20.0 --activate && pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ENABLE_COREPACK = "1"

# Astro 以 base='/inkloom' 构建时 dist 是扁平的（index.html/_astro/ 均在根），
# HTML 内的绝对引用带 /inkloom/ 前缀；GitHub Pages 靠仓库名子路径隐式提供该前缀，
# Netlify 服务在域名根，须用重写模拟同一行为。
# 注意：Netlify 匹配前会去掉尾斜杠，且空 splat 会自我 301——因此禁用一切 301，
# 仅用两条内部 200 重写（无 3xx 即无循环）；/ 由 dist/index.html 原生服务。
[[redirects]]
  from = "/inkloom"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/inkloom/*"
  to = "/:splat"
  status = 200
