# Netlify 免费档静态托管：纯静态站，不启用 Functions / Identity / Analytics 等任何付费特性
[build]
  # 与 .github/workflows/deploy.yml 相同的安装链（Node 22 + corepack 激活 pnpm），已在该链路验证可行
  command = "corepack enable && corepack prepare pnpm@11.20.0 --activate && pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ENABLE_COREPACK = "1"

# Astro 以 base='/inkloom' 构建时 dist 是扁平的（index.html/_astro/ 均在根），
# HTML 内的绝对引用带 /inkloom/ 前缀；GitHub Pages 靠仓库名子路径隐式提供该前缀，
# Netlify 服务在域名根，须用重写模拟同一行为：/inkloom/* → /*（内部 200 重写，不改浏览器地址）
[[redirects]]
  from = "/inkloom"
  to = "/inkloom/"
  status = 301

# /inkloom/ 本身 splat 为空会自我重定向死循环，须在其前显式内部重写到首页
[[redirects]]
  from = "/inkloom/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/inkloom/*"
  to = "/:splat"
  status = 200

# 根路径归一到带前缀的入口（force 越过 index.html 的静态优先）
[[redirects]]
  from = "/"
  to = "/inkloom/"
  status = 301
  force = true
